<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- REPRODUCTOR DE MÚSICA (VISIBLE CONTROLADO) -->

    <div class="musica" id="musicaBox">

        <p>Elige una canción y dale play</p>

        <select id="selectorCancion">

            <option value="">
                Selecciona una canción
            </option>

            <option value="november-rain.mp3">November Rain</option>
            <option value="dont-cry.mp3">Don't Cry</option>
            <option value="eres.mp3">Eres</option>
            <option value="is-this-love.mp3">Is This Love</option>

        </select>

        <button onclick="cargarCancion()">
            ▶ Reproducir
        </button>

        <button onclick="toggleMusica()">
            ⏸ Play / Pause
        </button>

    </div>

    <!-- AUDIO REAL -->
    <audio id="reproductor" loop></audio>

    <!-- CONTENEDOR PRINCIPAL -->

    <div class="contenedor" id="contenido">

        <h1>Ingresa la fecha</h1>

        <p>Escribe la fecha en formato día/mes</p>

        <input
            type="text"
            id="fecha"
            placeholder="dd/mm"
            oninput="validarFormulario()"
        >

        <button id="botonEnviar" onclick="verificarFecha()" disabled>
            Enviar
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
