<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="contenedor" id="contenido">

        <h1>Ingresa la fecha</h1>

        <p>Escribe la fecha en formato día/mes</p>

        <input
            type="text"
            id="fecha"
            placeholder="dd/mm"
            oninput="validarFormulario()"
        >

        <button id="botonEnviar" onclick="verificarFecha()" disabled>
            Enviar
        </button>

    </div>

</body>

<script src="script.js"></script>

</html>
