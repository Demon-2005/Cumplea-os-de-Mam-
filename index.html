<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BLOQUE DE MÚSICA -->

    <div class="musica" id="musicaBox">

        <p>Elige una canción para acompañar el recorrido</p>

        <select
            id="selectorCancion"
            onchange="validarFormulario()"
        >

            <option value="">
                Selecciona una canción
            </option>

            <option value="november rain.mp3">
                November Rain
            </option>

            <option value="dont cry.mp3">
                Don't Cry
            </option>

            <option value="eres.mp3">
                Eres
            </option>

            <option value="is this love.mp3">
                Is This Love
            </option>

        </select>

    </div>

    <!-- REPRODUCTOR OCULTO -->

    <audio
        id="reproductor"
        class="oculto"
    ></audio>

    <!-- CONTENEDOR PRINCIPAL -->

    <div class="contenedor" id="contenido">

        <h1>Ingresa la fecha</h1>

        <p>
            Escribe la fecha en formato día/mes
        </p>

        <input
            type="text"
            id="fecha"
            placeholder="dd/mm"
            oninput="validarFormulario()"
        >

        <button
            id="botonEnviar"
            onclick="verificarFecha()"
            disabled
        >
            Enviar
        </button>

    </div>

<audio id="musica" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<div id="pantallaInicio">
  Tocá la pantalla 🎵
</div>

<script>
const musica = document.getElementById("musica");

document.body.addEventListener("click", () => {
    musica.play();
    
    const inicio = document.getElementById("pantallaInicio");
    if(inicio){
        inicio.style.display = "none";
    }
}, { once: true });
</script>

    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
